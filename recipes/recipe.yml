---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: Wits
# description will be included in the image's metadata
description: A Silverblue-based personal image with Bluefin DX tools, R, Posit RStudio, and Android development support.

# Use Silverblue as the base to avoid inheriting Bluefin's branding and artwork.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
    install:
      packages:
        # Existing personal tools
        - micro
        - starship
        # R and the official Posit RStudio Desktop RPM (RHEL 9 build)
        - R
        - https://download1.rstudio.org/electron/rhel9/x86_64/rstudio-2025.09.1-401-x86_64.rpm
        # Bluefin DX Fedora-repository developer, container, and virtualization tools
        - android-tools
        - bcc
        - bpftop
        - bpftrace
        - cascadia-code-fonts
        - cockpit-bridge
        - cockpit-machines
        - cockpit-networkmanager
        - cockpit-ostree
        - cockpit-podman
        - cockpit-selinux
        - cockpit-storaged
        - cockpit-system
        - dbus-x11
        - docker-buildx-plugin
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
        - containerd.io
        - edk2-ovmf
        - flatpak-builder
        - genisoimage
        - git-subtree
        - git-svn
        - iotop
        - libvirt
        - libvirt-nss
        - nicstat
        - numactl
        - osbuild-selinux
        - p7zip
        - p7zip-plugins
        - podman-compose
        - podman-machine
        - podman-tui
        - qemu
        - qemu-char-spice
        - qemu-device-display-virtio-gpu
        - qemu-device-display-virtio-vga
        - qemu-device-usb-redirect
        - qemu-img
        - qemu-system-x86-core
        - qemu-user-binfmt
        - qemu-user-static
        - sysprof
        - incus
        - incus-agent
        - lxc
        - tiptop
        - trace-cmd
        - udica
        - util-linux-script
        - virt-manager
        - virt-v2v
        - virt-viewer
        - wtype
        - ydotool
        # Bluefin DX also includes VS Code and Docker CE
        - code
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          # Android Studio includes the IDE; install the SDK/emulator from its SDK Manager.
          - com.google.AndroidStudio
      - scope: user

  - type: signing
